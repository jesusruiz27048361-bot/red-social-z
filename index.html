<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Z Social</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #090d16; color: #f1f5f9; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 550px; padding: 16px; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 20px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .logo-title { font-size: 2.2rem; font-weight: 900; background: linear-gradient(135deg, #a855f7, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
    
    .user-badge { background: #1e293b; padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; color: #94a3b8; border: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #eab308; display: inline-block; }
    .status-dot.connected { background-color: #22c55e; }

    .create-post { background: #131c2e; border-radius: 16px; padding: 16px; margin: 20px 0; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    textarea { width: 100%; height: 85px; background: #0b1120; border: 1px solid #1e293b; border-radius: 10px; color: #fff; padding: 12px; resize: none; font-size: 0.95rem; line-height: 1.4; transition: border 0.2s; }
    textarea:focus, input:focus { outline: none; border-color: #8b5cf6; }
    
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .user-input-wrapper { display: flex; align-items: center; background: #0b1120; border: 1px solid #1e293b; border-radius: 8px; padding: 0 10px; }
    .user-input-prefix { color: #64748b; font-size: 0.85rem; font-weight: 600; }
    input[type="text"] { background: transparent; border: none; color: #38bdf8; padding: 8px 4px; font-size: 0.88rem; font-weight: 600; width: 110px; }
    
    button.btn-pub { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: white; border: none; padding: 10px 22px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; box-shadow: 0 2px 10px rgba(139, 92, 246, 0.3); }
    button.btn-pub:active { transform: scale(0.97); }

    .feed { display: flex; flex-direction: column; gap: 16px; }
    .post { background: #131c2e; border-radius: 16px; padding: 16px; border: 1px solid rgba(255,255,255,0.06); }
    .post-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; color: #64748b; margin-bottom: 10px; }
    .author-info { display: flex; align-items: center; gap: 10px; }
    .post-author { color: #38bdf8; font-weight: 700; font-size: 0.9rem; }
    
    .follow-btn { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .follow-btn.following { background: #1e293b; color: #94a3b8; border-color: #334155; }
    
    .post-content { font-size: 0.98rem; line-height: 1.5; color: #e2e8f0; word-break: break-word; margin-bottom: 14px; }
    .post-footer { display: flex; align-items: center; gap: 12px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; }
    .action-btn { background: #0b1120; border: 1px solid #1e293b; color: #94a3b8; padding: 6px 16px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .action-btn.like-btn { color: #f43f5e; }
    .action-btn.comment-btn { color: #38bdf8; }

    .comments-section { margin-top: 14px; padding-top: 12px; border-top: 1px dashed #1e293b; display: none; }
    .comments-section.open { display: block; }
    .comment-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .comment-item { background: #0b1120; padding: 10px 12px; border-radius: 10px; font-size: 0.88rem; border: 1px solid rgba(255,255,255,0.03); }
    .comment-author { color: #38bdf8; font-weight: 700; font-size: 0.78rem; margin-bottom: 2px; }
    .comment-form { display: flex; gap: 8px; }
    .comment-input { flex: 1; background: #0b1120; border: 1px solid #1e293b; border-radius: 8px; color: #fff; padding: 8px 12px; font-size: 0.85rem; }
    .btn-comment { background: #38bdf8; color: #090d16; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 0.82rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-title">Z</div>
      <div id="userBadge" class="user-badge">
        <span id="statusDot" class="status-dot"></span>
        <span id="userBadgeText">Conectando Pi...</span>
      </div>
    </header>

    <div class="create-post">
      <textarea id="postInput" placeholder="¿Qué estás pensando hoy?"></textarea>
      <div class="actions">
        <div class="user-input-wrapper">
          <span class="user-input-prefix">@</span>
          <input type="text" id="userInput" placeholder="usuario" value="UsuarioPi">
        </div>
        <button class="btn-pub" onclick="publicar()">Publicar</button>
      </div>
    </div>

    <div id="feed" class="feed"></div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://z-social-62720-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    let misSeguidos = {};

    function autenticarPi() {
      try {
        if (window.Pi) {
          const Pi = window.Pi;
          Pi.init({ version: "2.0", sandbox: false });
          Pi.authenticate(['username'], function(payment){}).then(function(auth) {
            if (auth && auth.user && auth.user.username) {
              const username = auth.user.username;
              document.getElementById('userInput').value = username;
              document.getElementById('userBadgeText').innerText = '@' + username;
              document.getElementById('statusDot').classList.add('connected');
              escucharSeguidos(username);
            }
          }).catch(function() {
            document.getElementById('userBadgeText').innerText = 'Modo Libre';
            escucharSeguidos(document.getElementById('userInput').value);
          });
        } else {
          document.getElementById('userBadgeText').innerText = 'Modo Libre';
          escucharSeguidos(document.getElementById('userInput').value);
        }
      } catch(e) {
        document.getElementById('userBadgeText').innerText = 'Modo Libre';
        escucharSeguidos(document.getElementById('userInput').value);
      }
    }

    window.onload = autenticarPi;

    // Escuchar a quién sigue el usuario actual
    function escucharSeguidos(miUsuario) {
      database.ref('usuarios/' + miUsuario + '/siguiendo').on('value', (snapshot) => {
        misSeguidos = snapshot.val() || {};
        renderFeed();
      });
    }

    // Función para seguir / dejar de seguir
    function toggleSeguir(targetUsuario) {
      const miUsuario = document.getElementById('userInput').value.trim() || 'Anónimo';
      if (miUsuario === targetUsuario) {
        alert("No puedes seguirte a ti mismo.");
        return;
      }

      const siguiendoRef = database.ref('usuarios/' + miUsuario + '/siguiendo/' + targetUsuario);
      const seguidorRef = database.ref('usuarios/' + targetUsuario + '/seguidores/' + miUsuario);

      if (misSeguidos[targetUsuario]) {
        siguiendoRef.remove();
        seguidorRef.remove();
      } else {
        siguiendoRef.set(true);
        seguidorRef.set(true);
      }
    }

    function publicar() {
      const input = document.getElementById('postInput');
      const userInput = document.getElementById('userInput');
      const texto = input.value.trim();
      const usuario = userInput.value.trim() || 'Anónimo';
      
      if (!texto) return;

      const nuevaPublicacion = {
        usuario: usuario,
        texto: texto,
        likes: 0,
        fecha: Date.now()
      };

      database.ref('publicaciones').push(nuevaPublicacion)
        .then(() => { input.value = ''; });
    }

    function darLike(postId) {
      const postRef = database.ref('publicaciones/' + postId + '/likes');
      postRef.transaction((currentLikes) => {
        return (currentLikes || 0) + 1;
      });
    }

    function toggleComentarios(postId) {
      const sec = document.getElementById('comments-' + postId);
      if (sec) sec.classList.toggle('open');
    }

    function agregarComentario(postId) {
      const input = document.getElementById('input-comment-' + postId);
      const texto = input.value.trim();
      const usuario = document.getElementById('userInput').value.trim() || 'Anónimo';

      if (!texto) return;

      database.ref('publicaciones/' + postId + '/comentarios').push({
        usuario: usuario,
        texto: texto,
        fecha: Date.now()
      }).then(() => { input.value = ''; });
    }

    let ultimosDatosPublicaciones = null;

    database.ref('publicaciones').on('value', (snapshot) => {
      ultimosDatosPublicaciones = snapshot.val();
      renderFeed();
    });

    function renderFeed() {
      const feed = document.getElementById('feed');
      feed.innerHTML = '';
      const miUsuario = document.getElementById('userInput').value.trim() || 'Anónimo';

      if (ultimosDatosPublicaciones) {
        const keys = Object.keys(ultimosDatosPublicaciones).reverse();
        keys.forEach(key => {
          const post = ultimosDatosPublicaciones[key];
          const fecha = new Date(post.fecha).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const likesCount = post.likes || 0;
          
          const comentariosObj = post.comentarios || {};
          const comentariosArr = Object.values(comentariosObj);
          const commentsCount = comentariosArr.length;

          const esMiPost = post.usuario === miUsuario;
          const loSigo = misSeguidos[post.usuario];

          let botonSeguirHTML = '';
          if (!esMiPost) {
            botonSeguirHTML = `
              <button class="follow-btn ${loSigo ? 'following' : ''}" onclick="toggleSeguir('${post.usuario}')">
                ${loSigo ? 'Siguiendo' : '+ Seguir'}
              </button>
            `;
          }

          let htmlComentarios = '';
          comentariosArr.forEach(c => {
            htmlComentarios += `
              <div class="comment-item">
                <div class="comment-author">@${c.usuario}</div>
                <div>${c.texto}</div>
              </div>
            `;
          });

          const postEl = document.createElement('div');
          postEl.className = 'post';
          postEl.innerHTML = `
            <div class="post-header">
              <div class="author-info">
                <span class="post-author">@${post.usuario}</span>
                ${botonSeguirHTML}
              </div>
              <span>${fecha}</span>
            </div>
            <div class="post-content">${post.texto}</div>
            <div class="post-footer">
              <button class="action-btn like-btn" onclick="darLike('${key}')">
                ❤️ <span>${likesCount}</span>
              </button>
              <button class="action-btn comment-btn" onclick="toggleComentarios('${key}')">
                💬 <span>${commentsCount}</span>
              </button>
            </div>
            <div class="comments-section" id="comments-${key}">
              <div class="comment-list">${htmlComentarios}</div>
              <div class="comment-form">
                <input type="text" id="input-comment-${key}" class="comment-input" placeholder="Escribe una respuesta...">
                <button class="btn-comment" onclick="agregarComentario('${key}')">Enviar</button>
              </div>
            </div>
          `;
          feed.appendChild(postEl);
        });
      }
    }
  </script>
</body>
</html>
