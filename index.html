<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Z Social</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; min-height: 100vh; pointer-events: auto !important; user-select: auto !important; }
    .container { width: 100%; max-width: 600px; padding: 15px; pointer-events: auto !important; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #334155; }
    h1 { color: #8b5cf6; font-size: 1.8rem; font-weight: 800; }
    .user-badge { background: #1e293b; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; border: 1px solid #475569; }
    .create-post { background: #1e293b; border-radius: 12px; padding: 15px; margin: 20px 0; border: 1px solid #334155; pointer-events: auto !important; }
    textarea { width: 100%; height: 90px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; padding: 10px; resize: none; font-size: 1rem; margin-bottom: 10px; pointer-events: auto !important; user-select: text !important; -webkit-user-select: text !important; }
    textarea:focus { outline: none; border-color: #8b5cf6; }
    .actions { display: flex; justify-content: space-between; align-items: center; }
    input[type="text"] { background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; padding: 8px 10px; font-size: 0.9rem; width: 130px; pointer-events: auto !important; user-select: text !important; -webkit-user-select: text !important; }
    button.btn-pub { background: #8b5cf6; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; pointer-events: auto !important; }
    .feed { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    .post { background: #1e293b; border-radius: 12px; padding: 15px; border: 1px solid #334155; }
    .post-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; }
    .post-author { color: #38bdf8; font-weight: 600; }
    .post-content { font-size: 1rem; line-height: 1.4; color: #e2e8f0; word-break: break-word; margin-bottom: 12px; }
    .post-footer { display: flex; align-items: center; border-top: 1px solid #334155; padding-top: 10px; }
    .like-btn { background: transparent; border: 1px solid #475569; color: #f43f5e; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .like-btn:active { transform: scale(0.95); background: rgba(244, 63, 94, 0.1); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Z</h1>
      <div id="userBadge" class="user-badge">Modo Libre</div>
    </header>

    <div class="create-post">
      <textarea id="postInput" placeholder="¿Qué está pasando en la comunidad?"></textarea>
      <div class="actions">
        <input type="text" id="userInput" placeholder="Tu usuario" value="UsuarioPi">
        <button class="btn-pub" onclick="publicar()">Publicar</button>
      </div>
    </div>

    <div id="feed" class="feed"></div>
  </div>

  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      databaseURL: "https://z-social-62720-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    // Intentar conectar Pi SDK
    try {
      const Pi = window.Pi;
      Pi.init({ version: "2.0", sandbox: false });
      Pi.authenticate(['username'], function(auth) {
        if(auth && auth.user && auth.user.username) {
          document.getElementById('userInput').value = auth.user.username;
          document.getElementById('userBadge').innerText = '@' + auth.user.username;
        }
      }, function(error) {
        console.log("Pi Auth error:", error);
      });
    } catch(e) {
      console.log("Pi SDK no disponible");
    }

    // Función para guardar publicaciones
    function publicar() {
      const input = document.getElementById('postInput');
      const userInput = document.getElementById('userInput');
      const texto = input.value.trim();
      const usuario = userInput.value.trim() || 'Anónimo';
      
      if (!texto) {
        alert('Escribe algo antes de publicar.');
        return;
      }

      const nuevaPublicacion = {
        usuario: usuario,
        texto: texto,
        likes: 0,
        fecha: Date.now()
      };

      database.ref('publicaciones').push(nuevaPublicacion)
        .then(() => {
          input.value = '';
        })
        .catch((err) => {
          alert('Error al publicar: ' + err.message);
        });
    }

    // Función para reaccionar / dar Me gusta
    function darLike(postId) {
      const postRef = database.ref('publicaciones/' + postId + '/likes');
      postRef.transaction((currentLikes) => {
        return (currentLikes || 0) + 1;
      });
    }

    // Escuchar la base de datos en tiempo real
    database.ref('publicaciones').on('value', (snapshot) => {
      const feed = document.getElementById('feed');
      feed.innerHTML = '';
      const data = snapshot.val();

      if (data) {
        const keys = Object.keys(data).reverse();
        keys.forEach(key => {
          const post = data[key];
          const fecha = new Date(post.fecha).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const likesCount = post.likes || 0;

          const postEl = document.createElement('div');
          postEl.className = 'post';
          postEl.innerHTML = `
            <div class="post-header">
              <span class="post-author">@${post.usuario}</span>
              <span>${fecha}</span>
            </div>
            <div class="post-content">${post.texto}</div>
            <div class="post-footer">
              <button class="like-btn" onclick="darLike('${key}')">
                ❤️ <span>${likesCount}</span>
              </button>
            </div>
          `;
          feed.appendChild(postEl);
        });
      }
    });
  </script>
</body>
</html>
