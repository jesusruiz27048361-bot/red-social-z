<!DOCTYPE html>
‎<html lang="es">
‎<head>
‎  <meta charset="UTF-8">
‎  <meta name="viewport" content="width=device-width, initial-scale=1.0">
‎  <title>Z - Red Social</title>
‎  <style>
‎    body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; }
‎    header { background-color: #4b2a84; color: white; text-align: center; padding: 15px; }
‎    .container { max-width: 500px; margin: 20px auto; padding: 0 10px; }
‎    .post-box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
‎    textarea { width: 100%; height: 70px; border: 1px solid #ccc; border-radius: 5px; padding: 8px; resize: none; box-sizing: border-box; }
‎    button { background-color: #4b2a84; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 8px; }
‎    .feed { display: flex; flex-direction: column; gap: 15px; }
‎    .post { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
‎    .post-author { font-weight: bold; color: #333; margin-bottom: 5px; }
‎  </style>
‎</head>
‎<body>
‎
‎  <header>
‎    <h1>Z</h1>
‎  </header>
‎
‎  <div class="container">
‎    <div class="post-box">
‎      <textarea id="postInput" placeholder="¿Qué estás pensando?"></textarea>
‎      <button onclick="publicar()">Publicar</button>
‎    </div>
‎
‎    <div class="feed" id="feed">
‎      <div class="post">
‎        <div class="post-author">Usuario Demo</div>
‎        <div>¡Bienvenidos a la red social Z!</div>
‎      </div>
‎    </div>
‎  </div>
‎
‎  <script>
‎    function publicar() {
‎      const texto = document.getElementById('postInput').value;
‎      if (texto.trim() === '') return;
‎      
‎      const feed = document.getElementById('feed');
‎      const nuevoPost = document.createElement('div');
‎      nuevoPost.className = 'post';
‎      nuevoPost.innerHTML = <div class="post-author">Tú</div><div>${texto}</div>;
‎      
‎      feed.prepend(nuevoPost);
‎      document.getElementById('postInput').value = '';
‎    }
‎  </script>
‎
‎</body>
‎</html>
