<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <h1>Bienvenido a Z</h1>
  <p id="user-status">Conectando...</p>

  <script>
    Pi.init({ version: "2.0", sandbox: true });

    function onIncompletePaymentFound(payment) {
      console.log("Pago incompleto:", payment);
    }

    Pi.authenticate(['username'], onIncompletePaymentFound)
      .then(function(auth) {
        document.getElementById('user-status').innerText = "Hola, " + auth.user.username;
      })
      .catch(function(error) {
        console.error("Error al autenticar:", error);
      });
  </script>
</body>
</html>
